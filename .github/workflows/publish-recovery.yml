name: Publish Recovery (one-off)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Point latest dist-tag at 1.0.1
        run: npm dist-tag add @snapeos/homebridge-cgd-garage-door@1.0.1 latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
